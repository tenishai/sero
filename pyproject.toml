[project]
name = "tenish-sero"
version = "0.1.2"
description = "Open-source secrets and vault management built on OpenBao"
requires-python = ">=3.14"
authors = [{ name = "tenish" }]
license = "AGPL-3.0-or-later"
# Runtime dependencies, pinned exactly. Bumps are their own reviewed PR.
dependencies = [
  "PyYAML==6.0.3",
  "hvac==2.4.0",
  "SQLAlchemy==2.0.51",
  "alembic==1.20.1",
  "mcp==1.30.0",
  "pyjwt[crypto]==2.15.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
# PostgreSQL driver for a shared datastore (D11). SQLite needs nothing extra.
postgres = ["psycopg[binary]==3.3.7"]

[dependency-groups]
# Dev tooling, pinned exactly. Bumps are their own reviewed PR.
dev = [
  "ruff==0.17.3",
  "pytest==9.2.0",
]

[tool.uv]
# Sero's Python code is run as tooling, not built into a distributable
# package, so uv does not need a build backend for it.
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# Alembic writes migration scripts in its own style (long create_table lines,
# unsorted imports). They are generated, not hand-maintained, so exclude them
# from lint/format. migrations/env.py and the template are still linted.
# scripts/check_arch_cards.py is a vendored copy kept byte-identical with its source.
extend-exclude = ["migrations/versions", "scripts/check_arch_cards.py"]

[tool.ruff.lint]
# A sensible, strict-but-quiet default set; expand as the code grows.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
