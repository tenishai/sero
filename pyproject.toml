[project]
name = "ladon"
version = "0.0.0"
description = "Open-source secrets and vault management built on OpenBao"
requires-python = ">=3.14"
license = "Apache-2.0"
# Runtime dependencies, pinned exactly. Bumps are their own reviewed PR.
dependencies = [
  "PyYAML==6.0.3",
]

[dependency-groups]
# Dev tooling, pinned exactly. Bumps are their own reviewed PR.
dev = [
  "ruff==0.15.17",
  "pytest==9.1.0",
]

[tool.uv]
# Ladon's Python code is run as tooling, not built into a distributable
# package, so uv does not need a build backend for it.
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# A sensible, strict-but-quiet default set; expand as the code grows.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
