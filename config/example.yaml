# Example Sero deployment configuration. Copy this, customize it, and keep it
# in your own configuration repository. Every value here is a placeholder.
#
# This file holds names, paths, and references only. Never put secret values in
# a Sero config; secrets live only in OpenBao.

# Platform settings for one deployment. The layers that consume these define
# their own detailed schemas; the shape below is illustrative.
deployment:
  environment: dev
  # KV v2 mount path the deployment uses. Optional; defaults to "kv".
  kv_mount: kv
  # Where the backend reaches OpenBao. The token is never here: it comes from
  # BAO_TOKEN (or VAULT_TOKEN) in the environment, and a token key in this block
  # is rejected rather than honoured. BAO_ADDR overrides the address.
  openbao:
    address: https://vault.example.com
  # Where the built UI lives, for the backend to serve. SERO_UI_DIST overrides
  # it. Omit both to run the API alone (the UI's dev server proxies to it).
  ui_dist: /srv/sero/ui
  # Revealing a plaintext value in the UI. Off unless a deployment turns it on;
  # with it off the reveal route answers 403 for everyone.
  reveal:
    enabled: false
  # Not read by any code yet: the OIDC auth method's inputs are CLI flags
  # (--oidc-discovery-url, --oidc-client-id, --oidc-client-secret-ref).
  oidc:
    discovery_url: https://id.example.com
    groups_claim: groups
  # Auto-unseal. Pluggable across clouds; references only, never key material.
  # Pick one provider and give its fields. Omit this block (or use
  # provider: shamir) for manual unseal with no cloud dependency.
  kms:
    provider: gcpckms        # gcpckms | awskms | azurekeyvault | shamir
    # gcpckms (authenticates via workload identity):
    project: <gcp-project-id>
    region: <kms-location>
    key_ring: <kms-keyring>
    crypto_key: <kms-key>
    # awskms (authenticates via instance/IRSA role):
    #   region: <aws-region>
    #   kms_key_id: <kms-key-id>
    # azurekeyvault (prefer a managed identity; omit client_id):
    #   tenant_id: <azure-tenant-id>
    #   vault_name: <key-vault-name>
    #   key_name: <unseal-key-name>

# How the backend learns who the caller is. A proxy in front of the platform
# authenticates the person and sets this header; there is no login form. The
# value may carry an "<issuer>:" prefix, which is stripped.
identity:
  header: x-goog-authenticated-user-email
  # The local development hatch: with this true, SERO_DEV_IDENTITY names the
  # caller and the backend warns at startup that identity is unverified. Leave
  # it false everywhere a second person can reach the process. It is ignored
  # entirely when an assertion is configured below.
  allow_dev_identity: false
  # The proxy's signed assertion. CONFIGURE THIS whenever the proxy can issue
  # one: the header above is an unverified claim that anything able to reach
  # this process can set, while an assertion is a proof. When present it is
  # required on every request, it decides the identity, and the plain header is
  # not read at all. Every field is required; verifying a signature without
  # checking the audience would accept any token the same proxy signed for any
  # other service. See the trust boundary in docs/backend.md.
  # assertion:
  #   header: x-goog-iap-jwt-assertion
  #   jwks_url: https://proxy.example.com/keys
  #   audience: /projects/<project-number>/apps/<app-id>
  #   issuer: https://proxy.example.com
  #   email_claim: email

# Who may reach which namespaces, and who administers the deployment. A caller
# gets the union of their direct membership and the namespaces of every group
# they belong to. Emails and group names are matched case-insensitively.
access:
  # Admins may use the admin routes (namespace requests, the allow list). Being
  # an admin grants no namespace: list the admin under members or a group too.
  admins:
    - admin@example.com
  members:
    operator@example.com: [team-a]
  groups:
    platform-engineering: [team-a, team-b]
  group_members:
    platform-engineering: [lead@example.com, operator@example.com]

# Machines permitted to write on a person's behalf. Commented out because the
# machine lane is closed until a deployment opens it: with no callers named,
# every request to /api/service/* is refused.
#
# Each entry pins everything that decides what one machine can do. The audience
# MUST differ from identity.assertion.audience above (a config that repeats it
# is refused at load), so a person's proxy assertion cannot be replayed here.
# The subject is the workload identity the token carries in its "sub" claim: a
# Kubernetes service account, a cloud service account's id or address. The
# namespaces are the only ones this caller may write in.
#
# A caller may merge keys into one path under apps/ and converge one
# ExternalSecret for one application. It cannot read a secret, reveal a value,
# administer the deployment, or reach a namespace not listed here. See the
# machine lane in docs/backend.md, including the network requirement: admit a
# machine caller to this port only where identity.assertion is configured.
#
# service_callers:
#   - name: provisioner
#     issuer: https://issuer.example.com
#     jwks_url: https://issuer.example.com/keys   # https only
#     audience: https://sero.example.com/service
#     subject: system:serviceaccount:sero:provisioner
#     # OpenBao namespaces this caller may write in. A nested path is fine.
#     # Two of them may not end in the same segment: store names are built
#     # from that segment, so `platform/team-a` and `other/team-a` would name
#     # the same stores and the lane could not tell their objects apart.
#     namespaces: [team-a]
#     # Kubernetes namespaces it may place an ExternalSecret in, beyond the
#     # application's own name. Empty is the right answer for one application
#     # in a namespace named after it, which is what onboarding creates.
#     k8s_namespaces: []
#     # Always true: every route records the person a machine call is for.
#     acting_email_required: true
#     # Writes a minute, across every write on the lane. Defaults to 60.
#     rate_limit_per_minute: 60
#     # Reads a minute, counted separately and higher: a caller polling the
#     # read while an application comes up must not spend the budget its own
#     # writes need. Defaults to 300.
#     read_limit_per_minute: 300

# Teams. Root config creates a namespace per team and, inside it, the KV v2
# mount above, the policy the team's access level grants (team-readwrite, or
# team-readonly), and external-secrets-read. An empty list is valid: the
# platform still has its root. Running that step needs a credential allowed to
# create namespaces and to write inside them.
#
# Applications are not listed here; each is onboarded by command, against this
# same config:
#
#   scripts/sero plan --phase app-onboarding --config config/example.yaml \
#     --team team-a --app sample --cluster cluster-a
#
# which renders that application's own policy, role, service account and store.
teams:
  - name: team-a
    namespace: team-a
    environments: [dev]
    groups: [team-a-admins]
    access: readwrite
  - name: team-b
    namespace: team-b
    environments: [dev, prod]
    access: readonly

# Sync targets. Parsed into DeploymentConfig.sync_targets, but nothing acts on
# them yet.
sync_targets:
  kubernetes:
    enabled: true
  gcp_secret_manager:
    enabled: false
  aws_secrets_manager:
    enabled: false
