# OpenBao Helm values: dev overlay.
#
# Layered on top of values-base.yaml for a local or development cluster. It
# trades durability and HA for a fast, cheap, single-node install that is easy
# to tear down. Not for production.
#
# Apply both files, base first:
#   helm ... -f values-base.yaml -f values-dev.yaml

server:
  # Single node: no quorum, no anti-affinity needed. Fine for dev, never prod.
  # Cleared explicitly: the base spreads replicas with a required pod
  # anti-affinity, and a managed cluster may price that (GKE Autopilot refuses
  # a pod with anti-affinity below 500m cpu, far above what dev requests).
  affinity: ""
  ha:
    replicas: 1
    raft:
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"
        }

        # Shamir (manual unseal) unless you layer a seal-values overlay on top;
        # see docs/deployment-order.md step 2a. As it stands there is no cloud
        # KMS dependency, and a person unseals after every restart.

        service_registration "kubernetes" {}

  # Smaller volumes; use the cluster default storage class.
  dataStorage:
    size: 1Gi
  auditStorage:
    size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
