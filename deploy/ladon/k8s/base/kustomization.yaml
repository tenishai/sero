# The manifests the deployment platform's generator preserves.
#
# The Deployment and the Service are deliberately absent: the generator emits
# them from gojira.yaml, and a second copy here would be two sources of truth
# for one object. A cluster running without that platform uses ../../standalone,
# which carries its own pair.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ladon

resources:
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - pvc.yaml
  - networkpolicy.yaml
