# The deploy contract for the Ladon backend.
#
# The deployment platform's generator owns the Deployment and the Service; this
# file is the input it reads and `k8s/base/` holds the manifests it preserves.
# Everything here is a placeholder: replace `<cluster>` with the cluster the
# platform registered, and keep the namespace and the service account matching
# `k8s/base/`.
#
# A cluster where that platform is not in use runs `standalone/` instead, which
# carries its own Deployment and Service over the same ConfigMap, Secret, and
# PersistentVolumeClaim. See README.md in this directory.

app: ladon
# `gateway`, not `web`. The two differ in exactly the ways that matter here:
# gateway recreates the pod instead of rolling it, does not attach a horizontal
# autoscaler, and probes /healthz. Ladon is a single writer, against a
# ReadWriteOnce volume that a second pod cannot attach while the first holds
# it, and its apply operations are background jobs that assume one process. A
# rolling update or a scale-out would either wedge on the volume or run two
# copies of a job that must run once.
class: gateway

environments:
  - name: dev
    cluster: <cluster>
    namespace: ladon

service_account: ladon

env:
  # The generated workload's port. The image defaults to 8000; 8080 is what
  # this class expects. The NetworkPolicy in k8s/base admits both.
  LADON_PORT: "8080"
  # LADON_CONFIG is deliberately NOT set on this path, and setting it is the
  # way to break this deployment. See the note on config_from below: the config
  # arrives inline as LADON_CONFIG_YAML, and the backend reads that only when
  # no file is configured. Pointing LADON_CONFIG at a path nothing mounts makes
  # the backend look for a file that is not there.
  #
  #   LADON_CONFIG: /etc/ladon/config.yaml   # only if something mounts it
  # OpenBao, in this same namespace (D13a). The token is in the Secret, never
  # here.
  BAO_ADDR: http://ladon-openbao.ladon.svc:8200
  # SQLite on the data volume below. Anything shared uses a PostgreSQL URL from
  # the bootstrap Secret instead, which wins over this value.
  LADON_DATABASE_URL: sqlite:////data/ladon.db
  # Restated as the image sets them, so the contract is readable without
  # opening the Dockerfile and a generator that drops the image's environment
  # does not silently break the layout.
  LADON_MIGRATIONS_DIR: /app/migrations
  LADON_UI_DIST: /srv/ladon/ui

# The deployment config. This is an envFrom source, not a volume: its keys
# become environment variables, so a `config.yaml` key would become an
# environment variable named `config.yaml` and never a file. The ConfigMap on
# this path therefore carries a single key, `LADON_CONFIG_YAML`, holding the
# config inline; the backend reads it when no file is configured. The
# standalone path mounts a file instead. See README.md.
config_from: [ladon-config]

# LADON_DATABASE_URL and BAO_TOKEN. Created once by an operator, out of band:
# it is the credential that lets Ladon reach OpenBao, so it cannot come from
# OpenBao. Nothing else in the deployment holds a secret value.
secrets_from: [ladon-bootstrap]

# The development datastore (SQLite at /data/ladon.db). fs_group matches the
# uid the image runs as, so the volume is writable without a root init step.
data_mount: { pvc: ladon-data, path: /data, fs_group: 10001 }
