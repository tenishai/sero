# The backend, for a cluster where the deployment platform is not in use.
#
# This is the same workload that platform's generator would emit, written out so
# a plain cluster can run Ladon with `kubectl apply -f`. It reads exactly the
# ConfigMap, Secret, and PersistentVolumeClaim the deploy contract names, so
# moving a deployment either way changes nothing the application sees.
#
# Replace before applying:
#   image          the tag the image workflow pushed (short commit sha), or
#                  better, the digest that workflow printed
#
# BAO_ADDR defaults to the in-cluster Service the bring-up path installs, so a
# deployment that follows docs/deployment-order.md needs no change there.
#
# One replica: the datastore may be SQLite on a ReadWriteOnce volume, and the
# apply jobs assume one writer. Scale only once LADON_DATABASE_URL is PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladon
  namespace: ladon
  labels:
    app.kubernetes.io/name: ladon
spec:
  replicas: 1
  strategy:
    # The volume is ReadWriteOnce, so a second pod cannot attach it while the
    # first still holds it. Replace the old pod, do not overlap.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ladon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ladon
    spec:
      serviceAccountName: ladon
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Matches the uid in the image, so the volume is writable without an
        # init container that chowns it as root.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ladon
          image: <registry-host>/<path>/ladon:<tag>
          # Always, because the reference above is a tag, and a tag can be
          # moved. IfNotPresent would then keep serving whatever a node already
          # cached under that name. Pin the image by digest instead (the image
          # workflow prints the digest it pushed) and this can go back to
          # IfNotPresent, because a digest cannot move.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # The port the process binds. Stated rather than left to the
            # image's default so it cannot drift from containerPort above.
            - name: LADON_PORT
              value: "8000"
            # This path is a real mounted file on this deploy path: the
            # ConfigMap is a volume below, not an envFrom source.
            - name: LADON_CONFIG
              value: /etc/ladon/config.yaml
            # Where OpenBao answers. The default is the in-cluster Service the
            # single-node bring-up installs in this namespace. The token is in
            # the Secret below, never here.
            - name: BAO_ADDR
              value: http://ladon-openbao.ladon.svc:8200
          envFrom:
            # LADON_DATABASE_URL and BAO_TOKEN. The only secret values in the
            # deployment, and the reason this Secret is created out of band.
            - secretRef:
                name: ladon-bootstrap
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # Generous: a slow migration at boot must not be read as a hang.
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/ladon
              readOnly: true
            - name: data
              mountPath: /data
            # The root filesystem is read-only, so everything that writes writes
            # here: helm and kubectl caches (the image points them at /tmp) and
            # anything Python spills.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: ladon-config
        - name: data
          persistentVolumeClaim:
            claimName: ladon-data
        - name: tmp
          emptyDir: {}
