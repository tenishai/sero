# The listener's settings: send http callers to https.
#
# The Ingress refers to this by name in its
# `networking.gke.io/v1beta1.FrontendConfig` annotation.
#
# Without it the load balancer serves plain http on port 80 as well as
# https, and a person who typed the hostname without a scheme reaches the
# plaintext one. That matters more here than on most services: the identity
# the backend trusts arrives in a header, and a header on an unencrypted
# connection is readable and rewritable by anything on the path. Redirect
# rather than disable, because a caller who is bounced to https lands where
# they meant to and a caller whose port 80 is simply closed sees a
# connection error and assumes the service is down.
#
# `MOVED_PERMANENTLY_DEFAULT` is a 301. Use `FOUND` (302) while a hostname
# is still moving around, because browsers and intermediaries cache a 301
# for a long time and a wrong one is hard to take back.
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: sero
  namespace: sero
  labels:
    app.kubernetes.io/name: sero
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
