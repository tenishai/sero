# Sero CI - static layer.
#
# This is the static/lint layer described in docs/testing.md: it runs on every
# pull request and push to main with no build and no infrastructure. It is
# structured to grow: unit and contract jobs are added as the code they test
# lands, and the gated integration smoke runs in a separate, opt-in workflow.
#
# All actions are pinned to a commit SHA (not a moving tag), per the
# pin-everything rule. See docs/versions.md.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # release.yml runs all of this on the tagged commit before it publishes

permissions:
  contents: read

jobs:
  conventions:
    name: conventions lint
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run conventions lint
        run: bash scripts/lint-conventions.sh

  helm-validate:
    name: helm and deploy validate
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Azure/setup-helm v5.0.0
      - uses: Azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          # Pinned Helm version, see docs/versions.md.
          version: v4.2.1
      # Azure/setup-kubectl v5.1.0
      - uses: Azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e
        with:
          # Pinned kubectl version, see docs/versions.md. The same version the
          # image carries, so CI checks the manifests with the client that
          # applies them.
          version: v1.37.0
      - name: Render OpenBao chart with Sero values
        run: bash scripts/validate-helm.sh
      # No cluster here, so this runs in its offline mode: the kustomization
      # builds and every document decodes. Full field-level validation needs a
      # reachable API server and is run by an operator. The script says which
      # mode it ran in.
      - name: Validate deploy manifests
        run: bash scripts/validate-deploy.sh

  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # hashicorp/setup-terraform v4.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          # Pinned Terraform version, see docs/versions.md.
          terraform_version: "1.15.6"
          terraform_wrapper: false
      - name: Validate Terraform substrate
        run: bash scripts/validate-terraform.sh

  python:
    name: python lint and test
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v8.2.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          # Pinned uv version, see docs/versions.md.
          version: "0.11.21"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Architecture cards are current
        # Each card pins the file it describes by blob sha; a seam that changed
        # without its card fails here (see AGENTS.md).
        run: uv run --frozen python scripts/check_arch_cards.py
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  image-smoke:
    name: image smoke
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Build only. Nothing is pushed and no registry credential is used, so
      # this runs on a pull request from a fork like any other check.
      - name: Build the image
        run: docker build --platform linux/amd64 --tag sero:ci .
      # The other jobs prove the code; this proves the image. A Dockerfile can
      # build and still produce something that cannot start: a missing runtime
      # file, a path the non-root user cannot read, a dependency left in the
      # dev group. Running it once and asking /healthz is the cheapest way to
      # find that on the pull request instead of on a cluster.
      #
      # The flags match how a deployment runs it: unprivileged, read-only root
      # filesystem, writable scratch and data mounts only. So this also proves
      # the securityContext in deploy/sero/standalone is one the image can
      # actually live under.
      - name: Run it and probe /healthz
        run: |
          set -euo pipefail
          cleanup() {
            echo "--- container logs ---"
            docker logs sero-ci 2>&1 || true
            docker rm -f sero-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name sero-ci \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001 \
            --env SERO_DATABASE_URL=sqlite:////data/sero.db \
            --publish 18000:8000 \
            sero:ci

          for _ in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:18000/healthz || true)"
            if [ "$code" = "200" ]; then
              echo "healthz answered 200"
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not answer 200 within 60s (last code: ${code:-none})" >&2
          exit 1

  ui:
    name: ui build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Test
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke test (render)
        run: npm run test:e2e

  # The one check the branch rules require: it passes only when every job above passed.
  # A skipped or cancelled job fails it, so nothing merges on a job that did not run.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [conventions, helm-validate, terraform-validate, python, image-smoke, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a job did not pass: $RESULTS"; exit 1; }
          done
