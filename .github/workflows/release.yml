# The release: what a pushed vX.Y.Z tag turns into, and nothing else builds an image
# (agora issue 58). In order, and each step has to pass for the next to run:
#
#   1. the whole of ci.yml, on the tagged commit
#   2. the tag names the version the project declares
#   3. the image, built for this machine: it starts, its Python licences are ones we can
#      ship, and it has no high or critical vulnerability that has a fix (.grype.yaml
#      says what that scan leaves out, and why)
#   4. the multi-arch image, published to ghcr under the tag and the short commit sha,
#      with an SBOM and build provenance attached
#   5. the GitHub release: notes from CHANGELOG.md, the SBOM and its checksum as files,
#      the image digest in the text (sero is run from its image, so there is no wheel)
#
# To build a tag again, run this workflow from that tag:
#   gh workflow run release.yml --ref vX.Y.Z
# RELEASING.md is the person's side of this.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
  PACKAGE_DIR: .  # where pyproject.toml lives
jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: The tag names the version the project declares
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$tag is not a vX.Y.Z tag; run this workflow from a release tag"; exit 1;; esac
          declared="$(sed -nE 's/^version = "([^"]+)"/\1/p' "$PACKAGE_DIR/pyproject.toml" | head -1)"
          [ "${tag#v}" = "$declared" ] || { echo "::error::tag $tag but pyproject.toml declares $declared"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          mkdir -p dist

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image for this machine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: candidate:release
          # The day goes in so the OS package upgrade runs again instead of coming out of the cache.
          build-args: APT_REFRESH=${{ steps.version.outputs.day }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: The image starts
        run: docker run --rm --entrypoint python candidate:release -m sero --help

      - name: Python licences we can ship
        run: docker run --rm -i --entrypoint python candidate:release - < scripts/check_licences.py

      - name: No high or critical vulnerability that has a fix
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6  # v7.4.3
        with:
          image: candidate:release
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56  # v0.24.4
        with:
          image: candidate:release
          format: spdx-json
          output-file: dist/${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Build and publish, both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: APT_REFRESH=${{ steps.version.outputs.day }}
          # Layers that did not change (pip, npm) come from the last build instead of being
          # rebuilt for both architectures; mode=max also caches the intermediate stages.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          line="Image: \`${IMAGE}@${DIGEST}\` (tags \`${TAG}\`, \`${SHA}\`; linux/amd64, linux/arm64)"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Notes are this version's section of the changelog.
            awk -v v="$VERSION" '/^## \[/{on = index($0, "## [" v "]") == 1; next} on' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json body --jq .body > body.md
          grep -qF "$DIGEST" body.md || { printf '\n\n%s\n' "$line" >> body.md; gh release edit "$TAG" --notes-file body.md; }
