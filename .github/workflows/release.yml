# The release image: built when a release is cut, and only then (agora issue 58).
# A push of a vX.Y.Z tag builds the multi-arch image, publishes it to ghcr under
# that tag and the short commit sha, and writes the digest onto the GitHub release.
# workflow_dispatch rebuilds an existing tag (first use: the releases cut before
# this workflow existed). No image is built on a push to main or on a schedule;
# installs copy the published image by digest into their own registry.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag (vX.Y.Z) to build the image for"
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
  PYPROJECT: pyproject.toml
jobs:
  image:
    name: multi-arch image
    # The build runner (dind) when the repo names one, else the CI runner, else GitHub's.
    runs-on: ${{ fromJSON(vars.CI_BUILD_RUNS_ON || vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: The tag names the version the project declares
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$tag is not a vX.Y.Z tag"; exit 1;; esac
          declared="$(sed -nE 's/^version = "([^"]+)"/\1/p' "$PYPROJECT" | head -1)"
          [ "${tag#v}" = "$declared" ] || { echo "::error::tag $tag but $PYPROJECT declares $declared"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          # Layers that did not change (apt, pip, npm) come from the last build instead of
          # being rebuilt for both architectures; mode=max also caches the intermediate stages.
          cache-from: type=registry,ref=ghcr.io/tenishai/sero:buildcache
          cache-to: type=registry,ref=ghcr.io/tenishai/sero:buildcache,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}

      - name: Record the digest on the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const { TAG, SHA, DIGEST, IMAGE } = process.env;
            const line = `Image: \`${IMAGE}@${DIGEST}\` (tags \`${TAG}\`, \`${SHA}\`; linux/amd64, linux/arm64)`;
            core.summary.addRaw(line).write();
            const { owner, repo } = context.repo;
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: TAG })).data; }
            catch (e) { core.notice(`no GitHub release for ${TAG}; digest recorded in the job summary only`); return; }
            const body = release.body || "";
            if (body.includes(DIGEST)) return;
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: `${body}\n\n${line}`.trim() });
